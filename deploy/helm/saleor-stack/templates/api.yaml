apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: saleor-api
  template:
    metadata:
      labels:
        app: saleor-api
    spec:
      containers:
        - name: api
          image: {{ .Values.api.image }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: saleor-db-credentials
                  key: password
            - name: DATABASE_URL
              value: "postgres://saleor:$(DB_PASSWORD)@db:5432/saleor"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: saleor-app-credentials
                  key: secret-key
            - name: CACHE_URL
              value: "redis://cache:6379/0"
            - name: CELERY_BROKER_URL
              value: "redis://cache:6379/0"
            - name: DEFAULT_CHANNEL_SLUG
              value: "default-channel"
          readinessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: saleor-api
  ports:
    - name: http
      port: 8000
      targetPort: http